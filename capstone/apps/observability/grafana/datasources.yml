apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true

  # CloudWatch uses the box's IAM role, so no keys are stored anywhere.
  - name: CloudWatch
    type: cloudwatch
    uid: cloudwatch
    jsonData:
      authType: default
      defaultRegion: us-east-1
