name: CI

on:
  pull_request:
    paths:
      - 'apps/node-ecs-service/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: 
          node-version: '22'
      
      
      
      
      - name: Install dependencies
        run: npm ci
        working-directory : apps/node-ecs-service

      - name: Build image
        run: docker build -f Dockerfile.multi -t myapp:ci
        working-directory : apps/node-ecs-servic
      