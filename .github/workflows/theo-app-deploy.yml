name: T.H.E.O. App Deploy

# Deploys the capstone's apps. DEPLOY ONLY: the tests ran on the pull request, in
# theo-ci.yml, before anything could merge.
#   optimizer  build the image, push to ECR (tagged with the commit), roll out to ECS
#   frontend   build the web app, copy it to S3, refresh CloudFront
# Each job runs only when its own folder changed on main (or from the manual button).

on:
  push:
    branches: [main]
    paths:
      - "capstone/apps/optimizer/**"
      - "capstone/apps/frontend/**"
      - ".github/workflows/theo-app-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write # ask GitHub for a signed OIDC token
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: theo-optimizer
  ECS_CLUSTER: theo-cluster
  ECS_SERVICE: theo-optimizer-service
  ECS_TASK_FAMILY: theo-optimizer
  CONTAINER_NAME: optimizer

concurrency: # two deploys must never run at once
  group: theo-app-deploy
  cancel-in-progress: false

jobs:
  # Which app changed? Lets one workflow deploy only what is needed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      optimizer: ${{ steps.scope.outputs.optimizer }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the full history, to compare with the commit before this push

      - id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "optimizer=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          for app in optimizer frontend; do
            if echo "$files" | grep -qE "^(capstone/apps/$app/|\.github/workflows/theo-app-deploy\.yml)"; then
              echo "$app=true" >> "$GITHUB_OUTPUT"
            else
              echo "$app=false" >> "$GITHUB_OUTPUT"
            fi
          done

  deploy:
    needs: changes
    if: needs.changes.outputs.optimizer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No stored secrets: GitHub's signed token is exchanged for ~1 hour of
      # credentials. The apply role can only be assumed from the main branch.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_THEO_ROLE_APPLY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The commit SHA is the tag, so every image is traceable to a commit. The
      # repository has IMMUTABLE tags: pushing the same SHA twice is refused.
      - name: Build and push image
        working-directory: capstone/apps/optimizer
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # Read what is actually deployed, change ONE field (the image), register
      # that as a new revision. jq strips read-only fields that
      # register-task-definition rejects.
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query 'taskDefinition' \
          | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy)
                | with_entries(select(.value != null))' \
          > task-definition.json

      - name: Render task definition with new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # Registers the revision, points the service at it, and waits until the
      # rollout is healthy. (Terraform ignores the service's task_definition, so
      # the next apply will not roll this back.)
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_THEO_ROLE_APPLY }}
          aws-region: ${{ env.AWS_REGION }}

      # The same script you run by hand: npm ci, build, S3 sync, CloudFront refresh.
      - run: capstone/apps/frontend/deploy-frontend.sh
