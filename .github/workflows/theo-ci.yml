name: T.H.E.O. CI

# All of the capstone's CHECKS, on pull requests.
#   check            terraform fmt + validate for every stack      (no AWS access)
#   plan             terraform plan, posted as a PR comment        (read-only role)
#   test-optimizer   the optimizer's unit tests + a Docker build   (no AWS access)
#   test-lambdas     the Lambda unit tests                         (no AWS access)
#   test-frontend    the web app's tests + a production build      (no AWS access)

on:
  pull_request:
    paths:
      - "capstone/infra/**"
      - "capstone/apps/optimizer/**"
      - "capstone/apps/lambdas/**"
      - "capstone/apps/frontend/**"
      - ".github/workflows/theo-ci.yml"

permissions:
  contents: read
  pull-requests: write # to comment the plan
  id-token: write # to get AWS credentials via OIDC

concurrency: # a new push to the PR cancels the previous run
  group: theo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # fmt and validate
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # report every broken stack, not just the first
      matrix:
        stack: [prerequisites, bootstrap, theo]
    defaults:
      run:
        working-directory: capstone/infra/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - run: terraform fmt -check -recursive

      # -backend=false skips connecting to S3, which is what lets this run without credentials.
      - run: terraform init -backend=false -input=false

      - run: terraform validate

  # The optimizer's maths: target reached, reserve respected, cheaper than naive.
  test-optimizer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capstone/apps/optimizer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # same as the Dockerfile
          cache: pip
          cache-dependency-path: capstone/apps/optimizer/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest -q

      # Prove the image still builds. Nothing is pushed from here
      - run: docker build -t theo-optimizer:ci .

  # Just run their unit tests.
  test-lambdas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # same runtime as the Lambdas

      - run: pip install pytest boto3

      # One folder per function; every folder with a tests/ directory is tested.
      - name: Run the Lambda tests
        run: |
          for dir in capstone/apps/lambdas/*/tests; do
            echo "== $dir"
            (cd "$(dirname "$dir")" && python -m pytest -q)
          done

  # Unit tests for the helper functions, then a real build (catches broken imports).
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capstone/apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: capstone/apps/frontend/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run build

  # plan needs real credentials, a live state bucket and your IP. The lab wipes
  # itself, so until the repo Variables exist (see capstone/PREREQUISITES.md)
  # this job skips instead of failing every pull request. (The IP is a SECRET, not
  # a Variable: the repository is public. A job-level `if` cannot read secrets, so
  # a step below checks it instead.)
  plan:
    needs: check
    if: vars.AWS_THEO_ROLE_PLAN != '' && vars.THEO_STATE_BUCKET != ''
    runs-on: ubuntu-latest
    env:
      TF_VAR_my_ip: ${{ secrets.MY_IP }} # terraform.tfvars is gitignored, so CI gets it from a repo secret
    defaults:
      run:
        working-directory: capstone/infra/theo
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Check the MY_IP secret exists
        run: '[ -n "$TF_VAR_my_ip" ] || { echo "Add the repository SECRET MY_IP (see capstone/PREREQUISITES.md)"; exit 1; }'

      # The read-only role: a pull request can plan but never change anything.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_THEO_ROLE_PLAN }}
          aws-region: us-east-1

      - run: terraform init -input=false -backend-config="bucket=${{ vars.THEO_STATE_BUCKET }}"

      # -lock=false because the plan role is read-only and taking a lock is a
      # write. Safe for plan. Never do this for apply.
      - name: Plan
        run: terraform plan -input=false -lock=false -no-color | tee plan.txt

      # The repo is PUBLIC: the comment hides the IP and the account number, and drops the refresh noise.
      - name: Comment the plan on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Terraform plan — capstone/infra/theo'
            echo '```'
            grep -vE ': (Refreshing state|Reading|Read complete)' plan.txt \
              | tail -60 \
              | sed -e "s/$TF_VAR_my_ip/***/g" -e 's/[0-9]\{12\}/************/g'
            echo '```'
            echo '_Plan only. Nothing applied._'
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
