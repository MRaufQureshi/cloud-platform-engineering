name: App Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the next step can diff against the base branch

      # "build" is a REQUIRED check on main, so this workflow must always start
      # and report. A path filter would leave the check "Expected" forever on a
      # pull request that only touches the capstone, and block the merge. Instead
      # the job always runs and skips its work when only THEO files changed.
      - name: Does this PR touch anything besides the THEO capstone?
        id: scope
        run: |
          # awk, not grep -qv: the same behaviour on every machine. Exit 0 = at least
          # one changed file is NOT part of the capstone.
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | awk '!/^(capstone\/|\.github\/workflows\/theo-)/ { found=1 } END { exit !found }'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "Only the THEO capstone changed: nothing to build here."
          fi

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.relevant == 'true'
        with: 
          node-version: '22'

      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: npm ci
        working-directory : apps/node-ecs-service

      - name: Build image
        if: steps.scope.outputs.relevant == 'true'
        run: docker build -f Dockerfile.multi -t myapp:ci .
        working-directory : apps/node-ecs-service
      