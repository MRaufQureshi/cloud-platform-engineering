name: THEO Lambdas Test

# Tests the capstone's Lambda functions. Runs ONLY when something under
# capstone/apps/lambdas/ changes. No AWS access needed.
# (Deploying them is Terraform's job: infra/theo/modules/ingestion zips the code.)

on:
  pull_request:
    paths:
      - "capstone/apps/lambdas/**"
      - ".github/workflows/theo-lambdas-test.yml"
  push:
    branches: [main]
    paths:
      - "capstone/apps/lambdas/**"
      - ".github/workflows/theo-lambdas-test.yml"

permissions:
  contents: read

concurrency:
  group: theo-lambdas-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # same runtime as the Lambdas

      - run: pip install pytest boto3

      # One folder per function; every folder with a tests/ directory is tested.
      - name: Run the tests
        run: |
          for dir in capstone/apps/lambdas/*/tests; do
            echo "== $dir"
            (cd "$(dirname "$dir")" && python -m pytest -q)
          done
